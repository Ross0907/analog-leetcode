name: Build Icarus Verilog from source

on:
  workflow_dispatch:
  push:
    branches: [main, kenshi0905/eda-learning-workspace]
    paths:
      - .github/workflows/build-icarus.yml
      - scripts/*icarus*
      - tests/icarus-source-build.test.mts
  pull_request:
    paths:
      - .github/workflows/build-icarus.yml
      - scripts/*icarus*
      - tests/icarus-source-build.test.mts

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: node scripts/prepare-icarus-source.mjs
      - name: Build compiler, preprocessor and event-driven runtime
        run: |
          image=$(node -p "require('./scripts/icarus-build-inputs.json').buildImage")
          docker run --rm --platform linux/amd64 --user root --mount "type=bind,source=$PWD,target=/workspace" --workdir /workspace "$image" bash scripts/build-icarus-wasm.sh
      - run: node scripts/package-icarus-source.mjs
      - name: Exercise actual compiled engine and every learning testbench
        run: |
          mkdir -p public/hdl/icarus
          cp .tmp/icarus-release/icarus/*.js .tmp/icarus-release/icarus/*.wasm public/hdl/icarus/
          node --import tsx --test tests/hdl.test.mts tests/icarus-source-build.test.mts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icarus-source-build
          path: .tmp/icarus-release/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: icarus-build-diagnostics
          path: |
            .tmp/icarus-build/source/config.log
            .tmp/icarus-build/output/emscripten-version.txt
            .tmp/icarus-build/output/build-packages.txt
          if-no-files-found: ignore
          retention-days: 14
