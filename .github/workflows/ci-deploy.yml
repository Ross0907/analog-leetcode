name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the validated main branch to the existing Cloudflare Worker"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: analog-leetcode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - name: Use project npm
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Verify dependency graph
        run: npm ls --all

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Vinext compatibility
        run: npx --no-install vinext check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build

      - name: Verify Cloudflare bundle
        run: test -f dist/server/wrangler.json

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - name: Use project npm
        run: npm install --global npm@12.0.2

      - name: Install locked dependencies
        run: npm ci

      - name: Check required deployment settings
        run: node scripts/prepare-deployment.mjs --check-settings

      - name: Production build
        run: npm run build

      - name: Verify generated Worker config
        run: test -f dist/server/wrangler.json

      - name: Verify simulator redistribution release requirements
        run: node scripts/audit-simulator-provenance.mjs --release

      - name: Prepare verified deployment and optional runtime secrets
        id: deployment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
        run: node scripts/prepare-deployment.mjs

      - name: Deploy generated Worker bundle
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.132.0"
          command: deploy --config dist/server/wrangler.json --secrets-file "${{ steps.deployment.outputs.secrets_file }}"

      - name: Remove temporary deployment secret file
        if: always()
        env:
          DEPLOYMENT_SECRETS_FILE: ${{ steps.deployment.outputs.secrets_file }}
        run: node -e "if (process.env.DEPLOYMENT_SECRETS_FILE) require('node:fs').rmSync(process.env.DEPLOYMENT_SECRETS_FILE, { force:true });"
