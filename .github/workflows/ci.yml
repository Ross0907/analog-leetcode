name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ">=22.13.0"
          cache: "npm"

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          fi

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          elif node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            npm run check
          fi

      - name: Unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm run test
          elif node -e "const p=require('./package.json'); const d={...(p.dependencies||{}),...(p.devDependencies||{})}; process.exit(d.vitest ? 0 : 1)"; then
            npx vitest run
          fi

      - name: Simulator provenance audit
        if: ${{ hashFiles('scripts/audit-simulator-provenance.mjs') != '' }}
        run: node scripts/audit-simulator-provenance.mjs

      - name: Install Playwright Chromium
        if: ${{ hashFiles('tests/e2e/**') != '' }}
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: ${{ hashFiles('tests/e2e/**') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            npm run test:e2e
          elif node -e "const p=require('./package.json'); const d={...(p.dependencies||{}),...(p.devDependencies||{})}; process.exit(d['@playwright/test'] || d.playwright ? 0 : 1)"; then
            npx playwright test
          fi

      - name: Production build
        run: npm run build
