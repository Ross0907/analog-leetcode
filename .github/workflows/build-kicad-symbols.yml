name: Export official KiCad symbols

on:
  push:
    branches: [fix/dependency-upgrades-ci]
    paths:
      - .github/workflows/build-kicad-symbols.yml
      - scripts/build-kicad-symbols.py
      - scripts/kicad-export-requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned official KiCad exporter
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://ppa.launchpadcontent.net/kicad/kicad-9.0-releases/ubuntu/pool/main/k/kicad/kicad_9.0.9~ubuntu24.04.1_amd64.deb' --output "$RUNNER_TEMP/kicad.deb"
          echo "b7e6d33867631dc44385067b703b4c39eadede2037a260790b19495fe17e43f0  $RUNNER_TEMP/kicad.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "$RUNNER_TEMP/kicad.deb" xvfb
          kicad-cli version
      - name: Install pinned build-time metadata reader
        shell: bash
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/kicad-python" --only-binary=:all: --require-hashes -r scripts/kicad-export-requirements.txt
      - name: Export SVGs with KiCad and record pin coordinates
        shell: bash
        env:
          KICAD_CONFIG_HOME: ${{ runner.temp }}/kicad-config
          PYTHONPATH: ${{ runner.temp }}/kicad-python
        run: xvfb-run --auto-servernum python3 scripts/build-kicad-symbols.py
      - uses: actions/upload-artifact@v6
        with:
          name: official-kicad-symbols
          path: public/kicad
          if-no-files-found: error
          retention-days: 14
